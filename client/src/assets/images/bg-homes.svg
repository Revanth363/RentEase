<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111"/>
      <stop offset="1" stop-color="#222"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC107"/>
      <stop offset="1" stop-color="#ff9800"/>
    </linearGradient>
    <pattern id="houses" patternUnits="userSpaceOnUse" width="120" height="120">
      <rect width="120" height="120" fill="none"/>
      <!-- House base -->
      <rect x="20" y="46" width="60" height="40" rx="3" ry="3" fill="#2c2c2c" stroke="#3a3a3a" stroke-width="2"/>
      <!-- Roof -->
      <polygon points="50,20 15,48 85,48" fill="url(#accent)" opacity="0.9"/>
      <!-- Door -->
      <rect x="46" y="62" width="12" height="24" fill="#151515"/>
      <!-- Windows -->
      <rect x="28" y="58" width="10" height="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="62" y="58" width="10" height="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1"/>
      <!-- Subtle highlight line -->
      <path d="M0 118 H120" stroke="#FFC107" stroke-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>
  <rect width="1600" height="900" fill="url(#houses)" opacity="0.55"/>
</svg>